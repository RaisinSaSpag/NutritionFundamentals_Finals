# SonarQube Configuration for Tele-nutrition & Digital Health Platform
sonar.projectKey=tele-nutrition-platform
sonar.projectName=Tele-nutrition & Digital Health Platform
sonar.projectVersion=1.0.0

sonar.sources=server/src,client/src,mock-ehr/src
sonar.tests=server/src/__tests__,client/src/__tests__
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,database/**,docs/**,e2e/**

sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=server/coverage/lcov.info,client/coverage/lcov.info
sonar.typescript.tsconfigPaths=server/tsconfig.json,client/tsconfig.json

# Quality Gate Thresholds
sonar.qualitygate.wait=true
sonar.coverage.exclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx,**/types/**,**/config/**
